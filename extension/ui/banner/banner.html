<link rel="stylesheet" href="banner.css">
<!-- High-Risk State Example -->
<div id="safety-ext-banner" class="severity-high" role="alert" aria-live="assertive">
  <div class="safety-ext-content">
    <div class="safety-ext-header">
      <span>🛑</span>
      <span>High Risk Warning: Possible Fake Website</span>
    </div>
    
    <!-- AI Bullet Points go here -->
    <ul class="safety-ext-reasons">
      <li>This web address looks like Amazon, but it is actually a different, unverified site.</li>
      <li>This website was created less than 2 days ago.</li>
    </ul>

    <!-- Plain-language recommendation -->
    <div class="safety-ext-advice">
      💡 Recommendation: Do not enter passwords or credit card details here and leave this website
    </div>
  </div>

  <div class="safety-ext-actions">
    <button id="safety-ext-leave-btn" class="safety-ext-btn-primary">
      Take Me to Safety
    </button>
    <button id="safety-ext-close-btn" class="safety-ext-btn-dismiss">
      Ignore Warning
    </button>
  </div>
</div>
